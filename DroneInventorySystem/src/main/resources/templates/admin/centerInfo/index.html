<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/template :: layout(~{::title},~{::body/content()})}">

<head>
	<title>InvenTrack</title>
</head>

<body>
	<div class="card shadow mb-4">

		<div class="card-header py-3">
			<h6 class="m-0 font-weight-bold text-primary">在庫センター情報</h6>
		</div>

		<div class="card-body">

			<!-- 検索フォーム -->
			<div class="search-container">
				<form class="form-inline" method="post" th:action="@{'/admin/centerInfo/search'}"
					th:object="${CenterInfoForm}">
					<label for="searchTerm" class="mr-2">検索条件</label>

					<label for="searchTerm" class="mr-2">センター名</label>
					<input type="text" id="searchTerm" name="centerName" class="form-control mr-2">

					<label for="searchTerm" class="mr-2">都道府県</label>
					<select id="searchTerm" name="region" class="form-control mr-2">
						<option value="">選択してください</option>
						<option th:each="region : ${regions}" th:value="${region.name}" th:text="${region.name}">
						</option>
					</select>

					<button type="submit" class="btn btn-primary">検索</button>
				</form>

				<!-- システムメッセージの表示 -->
				<div th:if="${systemMsg != null}" class="text-danger">
					<p th:text="${systemMsg}"></p>
				</div>
				<!-- エラーメッセージの表示 -->
				<div th:if="${errorMsg != null}" class="text-danger">
					<p th:text="${errorMsg}"></p>
				</div>

			</div>

			<!-- 在庫センター情報テーブル -->
			<div class="table-responsive">
				<table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
					<thead>
						<tr>
							<th>センター名</th>
							<th>住所</th>
							<th>電話番号</th>
							<th>管理者名</th>
							<th>最大保存容量(㎥)</th>
							<th>現在保存容量(㎥)</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="item : ${centerInfoList}">
							<td><a th:href="@{/admin/centerInfo/update/{id}(id=${item.centerId})}"><span th:text=${item.centerName}></span></a></td>
							<td> [[${item.address}]] </td>
							<td> [[${item.phoneNumber}]] </td>
							<td> [[${item.managerName}]] </td>
							<td> [[${item.maxStorageCapacity}]] </td>
							<td> [[${item.currentStorageCapacity}]] </td>
						</tr>
					</tbody>
				</table>
			</div>
			<!-- 在庫センター情報登録ボタン -->
			<form class="form-inline" method="get" th:action="@{'/admin/centerInfo/register'}">
				<button type="submit" class="btn btn-primary">登録</button>
			</form>
		</div>
	</div>
</body>

</html>
