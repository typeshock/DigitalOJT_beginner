<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/template :: layout(~{::title},~{::body/content()})}">

<head>
	<title>InvenTrack - 更新</title>
</head>

<body>
	<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
		<div class="card shadow-lg" style="width: 50%; max-width: 800px">
			<div class="card-header bg-success text-white py-2">
				<h6 class="mb-0">在庫センター情報更新</h6>
			</div>
			<!-- エラーメッセージの表示 -->
			<div th:if="${errorMsg != null}" class="text-danger">
				<p th:text="${errorMsg}"></p>
			</div>
			<div class="card-body py-2">
				<form class="small" th:action="@{/admin/centerInfo/update}" method="post" th:object="${CenterInfoForm}">
					
					<!-- PATCHリクエスト-->
					<input type="hidden" name="_method" value="patch" />
					
					<!-- 在庫センターId -->
					<input type="hidden" class="form-control form-control-sm" id="updateTerm" name="centerId" th:value="${centerInfoList.centerId}" />

					<!-- 在庫センター名 -->
					<div class="mb-2">
						<label for="centerName" class="form-label">在庫センター名<span class="text-danger">*</span></label>
						<input type="text" class="form-control form-control-sm" id="updateTerm" name="centerName" th:value="${centerInfoList.centerName}" required />
					</div>
					<!-- 郵便番号 -->
					<div class="mb-2">
						<label for="postCode" class="form-label">郵便番号<span class="text-danger">*</span></label>
						<input type="text" class="form-control form-control-sm" id="updateTerm" name="postCode" th:value="${centerInfoList.postCode}" required />
					</div>

					<!-- 住所 -->
					<div class="mb-2">
						<label for="address" class="form-label">住所<span class="text-danger">*</span></label>
						<input type="text" class="form-control form-control-sm" id="updateTerm" name="address" th:value="${centerInfoList.address}" required />
					</div>

					<!-- 電話番号 -->
					<div class="mb-2">
						<label for="phoneNumber" class="form-label">電話番号<span class="text-danger">*</span></label>
						<input type="text" class="form-control form-control-sm" id="updateTerm" name="phoneNumber" th:value="${centerInfoList.phoneNumber}" required />
					</div>

					<!-- 管理者名 -->
					<div class="mb-2">
						<label for="managerName" class="form-label">管理者名<span class="text-danger">*</span></label>
						<input type="text" class="form-control form-control-sm" id="updateTerm" name="managerName" th:value="${centerInfoList.managerName}" required />
					</div>

					<!-- 稼働状況ステータス -->
					<div class="mb-2">
						<label class="form-label">稼働状況ステータス<span class="text-danger">*</span></label>
						<div class="form-check form-check-inline">
							<input class="form-check-input" type="radio" value="0" id="updateTerm" name="operationalStatus" th:field="${centerInfoList.operationalStatus}" required />
							<label class="form-check-label" for="operationalStatusActive">稼働中</label>
						</div>
						<div class="form-check form-check-inline">
							<input class="form-check-input" type="radio" value="1" id="updateTerm" name="operationalStatus" th:field="${centerInfoList.operationalStatus}" required />
							<label class="form-check-label" for="operationalStatusInactive">稼働停止</label>
						</div>
					</div>

					<!-- 最大保管容量 -->
					<div class="mb-2">
						<label for="maxStorageCapacity" class="form-label">最大保管容量（m³）<span class="text-danger">*</span></label>
						<input type="number" class="form-control form-control-sm" id="updateTerm" name="maxStorageCapacity" th:value="${centerInfoList.maxStorageCapacity}" required />
					</div>

					<!-- 現在保管容量 -->
					<div class="mb-2">
						<label for="currentStorageCapacity" class="form-label">現在保管容量（m³）<span class="text-danger">*</span></label>
						<input type="number" class="form-control form-control-sm" id="updateTerm" name="currentStorageCapacity" th:value="${centerInfoList.currentStorageCapacity}" required />
					</div>

					<!-- 備考 -->
					<div class="mb-2">
						<label for="notes" class="form-label">備考</label>
						<textarea class="form-control form-control-sm" id="updateTerm" name="notes" th:text="${centerInfoList.notes}" rows="2"></textarea>
					</div>

					<!-- ボタン -->
					<div class="d-flex justify-content-between">
						<a href="/admin/centerInfo" class="btn btn-secondary btn-sm">キャンセル</a>
						<button type="submit" class="btn btn-success btn-sm">更新する</button>
					</div>
				</form>
			</div>
		</div>
	</div>
</body>

</html>
